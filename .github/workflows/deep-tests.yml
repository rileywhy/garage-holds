name: Deep geometry tests

# The generator tests in full: every random sweep at its full count with
# fresh seeds each night, and every hardware variant on every preset. Push CI
# runs a fixed sample of the same tests (ci.yml). Run it by hand on a lab
# branch before merging it; to reproduce a nightly failure, run it with the
# seed that run printed.
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      seed:
        description: Seed offset for the random sweeps (blank for a fresh one)
        required: false

permissions:
  contents: read

jobs:
  geometry:
    name: Deep geometry (${{ matrix.tool }})
    runs-on: ubuntu-latest
    # Sized to finish in about fifteen minutes; this only catches a hang.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        tool:
          - crimp-generator
          - sloper-generator
          - jug-generator
          - foot-generator
          - pocket-generator
          - pinch-generator
          - mesh-preview
    env:
      HOLD_TESTS_DEEP: "1"
      HOLD_TESTS_SEED: ${{ inputs.seed || github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/crimp-generator/requirements.txt
      - run: python -m pip install -r tools/crimp-generator/requirements.txt
      - name: Run the tests in full
        shell: bash
        run: |
          echo "HOLD_TESTS_SEED=$HOLD_TESTS_SEED"
          python -m unittest discover -s tools/${{ matrix.tool }}/tests -v 2>&1 | tee tests.log

      # Nobody watches a nightly run, so a failure posts to Discord. A run
      # started by hand reports to whoever started it.
      - name: Post the failure to Discord
        if: (failure() || cancelled()) && github.event_name == 'schedule'
        env:
          WEBHOOK: ${{ secrets.DISCORD_ALERT_WEBHOOK }}
          TOOL: ${{ matrix.tool }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          failures=$(grep -E '^(FAIL|ERROR):' tests.log 2>/dev/null | head -5)
          content=$(printf '🔴 Nightly deep tests failed for %s at %s (seed %s)\n%s\n%s' \
            "$TOOL" "${GITHUB_SHA:0:7}" "$HOLD_TESTS_SEED" "${failures:-timed out or failed before the tests}" "$RUN_URL" | head -c 1900)
          echo "$content"
          [ -z "$WEBHOOK" ] || curl -sS -o /dev/null --max-time 20 \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg content "$content" '{content: $content}')" "$WEBHOOK"
