name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request replaces its older run. Runs on main always
# finish, so every commit that reached production has a result on record: on
# 2026-10-16 the run for the commit that broke the home page was cancelled by
# the rollback push and never reported.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  # One job per generator, in parallel. The sweeps run a fixed sample here;
  # deep-tests.yml runs them in full every night. The timeout only catches a
  # hung test: keep each job near two minutes by sampling, not by raising it.
  geometry:
    name: Hold geometry (${{ matrix.tool }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        tool:
          - crimp-generator
          - sloper-generator
          - jug-generator
          - foot-generator
          - pocket-generator
          - pinch-generator
          - mesh-preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/crimp-generator/requirements.txt
      - run: python -m pip install -r tools/crimp-generator/requirements.txt
      - run: python -m unittest discover -s tools/${{ matrix.tool }}/tests -v

  # The code every generator shares (tools/*.py), tested on its own, and
  # every lab's defaults, controls and presets against
  # tools/hold_hardware.json (RIL-116). New labs are found by folder, so this
  # job never needs a matrix entry.
  shared:
    name: Shared generator code
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/crimp-generator/requirements.txt
      - run: python -m pip install -r tools/crimp-generator/requirements.txt
      - run: python -m unittest discover -s tools/tests -v

  checks:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Requests every route of the build with no environment variables set;
      # pages that render per request only ever run here.
      - run: npm run test:smoke

  ownership:
    name: Ownership tests on a local Supabase stack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Docker is preinstalled on the runner. Studio and image resizing are
      # not needed to exercise the database policies.
      - run: npx supabase start -x studio,imgproxy
      - run: npm run test:integration
      - name: Generated types match the migrations
        run: |
          npm run db:types
          git diff --exit-code -- src/lib/supabase/database.types.ts
      - name: Save generated database types
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: database-types
          path: src/lib/supabase/database.types.ts
      - if: always()
        run: npx supabase stop --no-backup

  # The one check the main branch ruleset requires before a pull request can
  # merge (.github/rulesets/main.json), so adding or renaming a job here
  # never means editing the ruleset. A failed, timed-out or cancelled job
  # fails it.
  passed:
    name: CI passed
    needs: [geometry, shared, checks, ownership]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          broken=$(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"')
          [ -z "$broken" ] || { echo "$broken"; exit 1; }

  # A push to main that fails or times out posts to Discord. A run whose
  # commit is no longer the tip of main stays quiet: the newer run reports.
  # On 2026-10-16 the geometry job timed out on two pushes and nobody saw.
  alert:
    name: Alert on a broken main
    needs: [geometry, shared, checks, ownership]
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Post the failure to Discord
        env:
          GH_TOKEN: ${{ github.token }}
          WEBHOOK: ${{ secrets.DISCORD_ALERT_WEBHOOK }}
          NEEDS: ${{ toJSON(needs) }}
          MESSAGE: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          broken=$(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"')
          [ -n "$broken" ] || exit 0
          tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$tip" != "$GITHUB_SHA" ]; then
            echo "main has moved on to $tip; its own run reports."
            exit 0
          fi
          content=$(printf '🔴 CI broke on main at %s "%s"\n%s\n%s' \
            "${GITHUB_SHA:0:7}" "${MESSAGE%%$'\n'*}" "$broken" "$RUN_URL" | head -c 1900)
          echo "$content"
          [ -z "$WEBHOOK" ] || curl -sS -o /dev/null --max-time 20 \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg content "$content" '{content: $content}')" "$WEBHOOK"
