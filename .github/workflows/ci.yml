name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  crimp-generator:
    name: Hold geometry and export tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/crimp-generator/requirements.txt
      - run: python -m pip install -r tools/crimp-generator/requirements.txt
      - run: python -m unittest discover -s tools/crimp-generator/tests -v
      - run: python -m unittest discover -s tools/sloper-generator/tests -v
      - run: python -m unittest discover -s tools/jug-generator/tests -v
      - run: python -m unittest discover -s tools/foot-generator/tests -v
      - run: python -m unittest discover -s tools/pocket-generator/tests -v
      - run: python -m unittest discover -s tools/mesh-preview/tests -v

  checks:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  ownership:
    name: Ownership tests on a local Supabase stack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Docker is preinstalled on the runner. Studio and image resizing are
      # not needed to exercise the database policies.
      - run: npx supabase start -x studio,imgproxy
      - run: npm run test:integration
      - name: Generated types match the migrations
        run: |
          npm run db:types
          git diff --exit-code -- src/lib/supabase/database.types.ts
      - name: Save generated database types
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: database-types
          path: src/lib/supabase/database.types.ts
      - if: always()
        run: npx supabase stop --no-backup
